<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 561 526"
     width="561"
     height="526"
     role="img"
     aria-label="Product Toolkit"
     font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

  <text x="280.5"
        y="25"
        text-anchor="middle"
        font-size="15"
        font-weight="700"
        fill="#e6edf3">Product Toolkit</text>

  <g transform="translate(284.5,289.0)">

    <!-- Radar grid -->
    <polygon
      points="0,-212 165.7,-132.2 206.7,47.2 92,191 -92,191 -206.7,47.2 -165.7,-132.2"
      fill="none"
      stroke="#30363d"
      stroke-width="1"
      opacity="0.85"/>

    <polygon
      points="0,-159 124.3,-99.1 155,35.4 69,143.3 -69,143.3 -155,35.4 -124.3,-99.1"
      fill="none"
      stroke="#30363d"
      stroke-width="1"
      opacity="0.72"/>

    <polygon
      points="0,-106 82.9,-66.1 103.3,23.6 46,95.5 -46,95.5 -103.3,23.6 -82.9,-66.1"
      fill="none"
      stroke="#30363d"
      stroke-width="1"
      opacity="0.60"/>

    <polygon
      points="0,-53 41.4,-33 51.7,11.8 23,47.8 -23,47.8 -51.7,11.8 -41.4,-33"
      fill="none"
      stroke="#30363d"
      stroke-width="1"
      opacity="0.47"/>

    <!-- Radar axes -->
    <line x1="0" y1="0" x2="0" y2="-212"
          stroke="#21262d" stroke-width="1"/>

    <line x1="0" y1="0" x2="165.7" y2="-132.2"
          stroke="#21262d" stroke-width="1"/>

    <line x1="0" y1="0" x2="206.7" y2="47.2"
          stroke="#21262d" stroke-width="1"/>

    <line x1="0" y1="0" x2="92" y2="191"
          stroke="#21262d" stroke-width="1"/>

    <line x1="0" y1="0" x2="-92" y2="191"
          stroke="#21262d" stroke-width="1"/>

    <line x1="0" y1="0" x2="-206.7" y2="47.2"
          stroke="#21262d" stroke-width="1"/>

    <line x1="0" y1="0" x2="-165.7" y2="-132.2"
          stroke="#21262d" stroke-width="1"/>


    <!-- Product Toolkit area -->
    <g>

      <animateTransform
        attributeName="transform"
        type="scale"
        values="0.04;1"
        dur="1.1s"
        calcMode="spline"
        keyTimes="0;1"
        keySplines="0.22 1 0.36 1"
        fill="freeze"/>

      <!--
        Scores:
        Product:    90
        Analytics:  82
        AI:         88
        Research:   84
        Automation: 76
        Design:     72
        Data:       78
      -->

      <polygon
        points="
          0,-190.8
          135.7,-108.4
          170.5,39.0
          69.9,144.6
          -66.2,137.5
          -157.3,36.0
          -119.3,-95.2"
        fill="#39d353"
        fill-opacity="0.22"
        stroke="#3fb950"
        stroke-width="2.5"
        stroke-linejoin="round"/>

      <!-- Skill points -->

      <circle cx="0" cy="-190.8"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

      <circle cx="135.7" cy="-108.4"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

      <circle cx="170.5" cy="39"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

      <circle cx="69.9" cy="144.6"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

      <circle cx="-66.2" cy="137.5"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

      <circle cx="-157.3" cy="36"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

      <circle cx="-119.3" cy="-95.2"
              r="3.6"
              fill="#7ee787"
              stroke="#3fb950"
              stroke-width="1.2"/>

    </g>


    <!-- Labels -->

    <text x="0"
          y="-237"
          text-anchor="middle"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">Product</text>

    <text x="181.4"
          y="-149.6"
          text-anchor="start"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">Analytics</text>

    <text x="226.2"
          y="55.6"
          text-anchor="start"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">AI</text>

    <text x="100.7"
          y="223"
          text-anchor="start"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">Research</text>

    <text x="-100.7"
          y="223"
          text-anchor="end"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">Automation</text>

    <text x="-226.2"
          y="55.6"
          text-anchor="end"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">Design</text>

    <text x="-181.4"
          y="-149.6"
          text-anchor="end"
          font-size="12"
          font-weight="600"
          fill="#c9d1d9">Data</text>

  </g>

</svg>
